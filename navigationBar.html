<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        body{
            color: aliceblue;
        }
        nav{
            background-color: #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: aliceblue;
        }
        ul{
            display: flex;
            gap: 20px;
            list-style: none;
            color: aliceblue;
        }
        a{
            text-decoration: none;
            color: aliceblue;
        }
    </style>
</head>

<body>
    <nav>
        <h2>MyWebsite</h2>
        <ul>
            <li> <a href="">Home</a></li>
            <li> <a href="">About</a></li>
            <li> <a href="">Service</a></li>
        </ul>
        <button>Sign Up</button>
    </nav>
</body>

</html>
