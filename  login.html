<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e9ecef;
        }

        div {
            background-color: #ffffff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* Elements ke beech ka space */
            border-radius: 10px;
            /* Halke gol kinare */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            /* Form ko 3D look dene ke liye shadow */
            width: 300px;
        }

        h2 {
            margin: 0 0 10px 0;
            /* Heading ke niche thodi aur jagah */
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            /* Padding ko width ke andar rakhne ke liye */
        }

        button {
            background-color: blue;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>
    <div>
        <h2>Welcome Back</h2>

        <input type="email" placeholder="Enter your email">

        <input type="password" placeholder="Enter your password">
        <button>Login</button>

    </div>
</body>

</html>
